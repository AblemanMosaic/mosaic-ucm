<script>
let ontology=null,session=null,selected=null,activeView='anatomy';const conditionValues={},$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const subjectById=id=>ontology.subjects.find(item=>item.subject_id===id);
const opt=s=>[...document.querySelectorAll(s)],batchSelection=new Set();let thumbValue;
function specimenValue(){return thumbValue!==undefined?thumbValue:session.specimen_value}
function condition(id){return conditionValues[id]}
function renderConditions(){const host=$('#conditions'),applied=new Set(['state','viewport','direction']);host.innerHTML='';for(const item of ontology.conditions){conditionValues[item.condition_id]=session?.conditions[item.condition_id]??item.default;if(item.condition_id==='state'&&!session.action_scope.state_control_visible)continue;const wrap=document.createElement('div');wrap.className='condition';const label=document.createElement('label');label.htmlFor='condition-'+item.condition_id;label.textContent=item.condition_id==='state'?'State · simulated':item.label+(applied.has(item.condition_id)?' · applied':' · context');const select=document.createElement('select');select.id=label.htmlFor;select.dataset.condition=item.condition_id;const options=item.condition_id==='state'?session.applicable_states:item.options;for(const option of options){const node=document.createElement('option');node.value=option;node.textContent=String(option).replaceAll('_',' ').toLowerCase().replace(/^./,c=>c.toUpperCase());select.appendChild(node)}select.value=conditionValues[item.condition_id];select.onchange=()=>reviewAction({intent:'SET_CONDITION',target:item.condition_id,value:select.value}).catch(showError);wrap.append(label,select);host.appendChild(wrap)}}
function thumbnailMarkup(item){const def=item.metadata?.specimen;if(!def)return null;thumbValue=def.value_model?.default;let html='';try{html=renderGovernedSpecimen(item)}catch(error){html=''}finally{thumbValue=undefined}if(!html)return null;const t=document.createElement('template');t.innerHTML=html;for(const el of t.content.querySelectorAll('*'))for(const a of ['id','for','name','aria-labelledby','aria-describedby','aria-controls','tabindex'])el.removeAttribute(a);const wrap=document.createElement('span');wrap.className='thumb';wrap.setAttribute('aria-hidden','true');wrap.inert=true;wrap.appendChild(t.content);return wrap}
function renderCatalog(query=''){const host=$('#catalog'),thumbs=host.dataset.thumbnails!==undefined,batch=host.dataset.batch!==undefined,needle=query.trim().toLowerCase(),marks={NEEDS_REVIEW:'[ ]',APPROVED:'[OK]',ISSUE:'[!]',DEFERRED:'[-]'};host.innerHTML='';for(const group of ontology.groups){const items=group.subject_ids.map(subjectById).filter(item=>!needle||(item.label+' '+item.summary+' '+item.component_kinds.join(' ')).toLowerCase().includes(needle));if(!items.length)continue;const section=document.createElement('section');section.className='group';const title=document.createElement('h2');title.textContent=group.label;section.appendChild(title);for(const item of items){const button=document.createElement('button');button.type='button';button.className='subject'+(item.subject_id===selected?' active':'');button.dataset.subject=item.subject_id;const disposition=session?.reviews[item.subject_id]?.disposition||'NEEDS_REVIEW';button.innerHTML=`<span><span class="review-mark">${marks[disposition]}</span>${esc(item.label)}</span><small>${esc(item.subject_type)}</small>`;button.onclick=()=>reviewAction({intent:'SELECT_SUBJECT',value:item.subject_id});if(thumbs){const th=thumbnailMarkup(item);if(th){button.appendChild(th);button.classList.add('has-thumb')}}if(batch){const tile=document.createElement('div');tile.className='tile';const pick=document.createElement('input');pick.type='checkbox';pick.className='batch-pick';pick.checked=batchSelection.has(item.subject_id);pick.setAttribute('aria-label','Select '+item.label+' for a batch decision');pick.onchange=()=>{pick.checked?batchSelection.add(item.subject_id):batchSelection.delete(item.subject_id);renderBatchBar()};tile.append(pick,button);section.appendChild(tile)}else section.appendChild(button)}host.appendChild(section)}renderBatchBar()}
function renderBatchBar(){const bar=opt('#batch-bar')[0];if(!bar)return;const n=batchSelection.size;bar.hidden=n===0;for(const c of opt('#batch-count'))c.textContent=n+' selected';for(const b of opt('[data-batch-disposition]'))b.disabled=n===0||!session?.action_scope?.disposition_enabled}
function renderStatebar(){const bar=$('#statebar'),state=condition('state'),scope=session.action_scope;bar.innerHTML='';bar.hidden=!scope.state_control_visible;if(!scope.state_control_visible){bar.removeAttribute('aria-label');return}const applicable=new Set(session.applicable_states);bar.setAttribute('aria-label','Simulated specimen state');for(const value of ['IDLE','HOVER','FOCUSED','PRESSED','DISABLED','PENDING','REFUSED']){const button=document.createElement('button');button.type='button';button.textContent=value.toLowerCase();button.className=value===state?'active':'';button.disabled=!applicable.has(value);button.title=button.disabled?'Not applicable to this review subject':'Simulate '+value.toLowerCase();button.onclick=()=>reviewAction({intent:'SET_CONDITION',target:'state',value}).catch(showError);bar.appendChild(button)}}
function commonState(){const state=condition('state'),attrs=state==='DISABLED'?' disabled':'',klass=state==='REFUSED'?' refused':state==='PENDING'?' pending':'';return{state,attrs,klass}}
function componentSpecimen(kind){const {state,attrs,klass}=commonState(),disabled=state==='DISABLED';const checked=state==='PRESSED'?' checked':'';const button=`<button type="button" class="demo-button emphasis${klass}"${attrs}>Create project</button>`;const map={
BUTTON:`<div class="demo"><span class="demo-label">Emphasis and intent</span><div class="demo-row">${button}<button type="button" class="demo-button${klass}"${attrs}>Cancel</button><button type="button" class="demo-button danger"${attrs}>Delete</button></div><span class="demo-label">State: ${state}</span></div>`,
TEXT_FIELD:`<div class="demo"><label>Project name</label><input class="demo-input${klass}" value="Constitutional Workbench"${attrs}><span class="demo-label">Visible label, committed value, bounded length</span></div>`,
SELECT:`<div class="demo"><label>Evidence scope</label><select class="${klass}"${attrs}><option>All evidence</option><option>Passing</option><option>Refused</option></select></div>`,
COMBOBOX:`<div class="demo"><label>Target profile</label><input class="demo-input${klass}" list="profile-values" value="Mosaic Signature"${attrs}><datalist id="profile-values"><option value="Mosaic Signature"><option value="High contrast"></datalist></div>`,
CHECKBOX:`<div class="demo"><fieldset><legend>Delivery options</legend><label><input type="checkbox"${checked}${attrs}> Include receipt ledger</label><label><input type="checkbox" checked${attrs}> Preserve semantic metadata</label></fieldset></div>`,
RADIO_GROUP:`<div class="demo"><fieldset><legend>Release channel</legend><label><input type="radio" name="channel" checked${attrs}> Stable</label><label><input type="radio" name="channel"${attrs}> Candidate</label></fieldset></div>`,
SEGMENTED:`<div class="demo"><span class="demo-label">Review mode</span><div class="demo-row"><button class="demo-button emphasis"${attrs}>Summary</button><button class="demo-button"${attrs}>Details</button><button class="demo-button"${attrs}>Evidence</button></div></div>`,
STEPPER:`<div class="demo"><span class="demo-label">Review step</span><div class="demo-row"><button class="demo-button"${attrs}>Back</button><strong>2 of 4 / Inspect</strong><button class="demo-button emphasis"${attrs}>Next</button></div></div>`,
NAVIGATION:`<div class="demo"><nav class="demo-row" aria-label="Workspace"><button class="demo-button emphasis"${attrs}>Overview</button><button class="demo-button"${attrs}>Components</button><button class="demo-button"${attrs}>Evidence</button></nav></div>`,
MENU:`<div class="demo"><fieldset${disabled?' disabled':''}><legend>Application menu</legend><div class="demo-row"><button class="demo-button"${attrs}>File</button><button class="demo-button"${attrs}>Edit</button><button class="demo-button"${attrs}>View</button></div></fieldset></div>`,
TAB_BAR:`<div class="demo"><div class="demo-row" role="tablist"><button class="demo-button emphasis" role="tab"${attrs}>Anatomy</button><button class="demo-button" role="tab"${attrs}>Accessibility</button><button class="demo-button" role="tab"${attrs}>Evidence</button></div></div>`,
TREE:`<div class="demo"><div class="panel" role="tree" aria-disabled="${disabled}"><div role="treeitem" tabindex="${disabled?'-1':'0'}">Application</div><div role="treeitem" style="padding-left:18px">Header</div><div role="treeitem" style="padding-left:18px">Workspace</div><div role="treeitem" style="padding-left:36px">Button</div></div></div>`,
LABEL:`<div class="demo"><span class="demo-label">Heading role</span><h2 style="margin:0">Release evidence console</h2><p style="margin:0;color:var(--quiet)">Supporting copy remains subordinate and readable.</p></div>`,
BADGE:`<div class="demo"><div class="demo-row"><span class="chip">Local candidate</span><span class="chip">Browser</span><span class="chip">Win32</span></div></div>`,
STATUS:`<div class="demo"><div class="status">Runtime connected</div><div class="notice">24 checks passed with no local refusals.</div></div>`,
PROGRESS:`<div class="demo"><label>Evidence coverage</label><progress value="84" max="100">84%</progress><span class="demo-label">84% / semantic and parity checks</span></div>`,
KEY_VALUE:`<div class="demo"><div class="property"><span>Profile</span><span>Mosaic Signature</span></div><div class="property"><span>Realizer</span><span>${esc(condition('realizer'))}</span></div><div class="property"><span>State</span><span>${esc(state)}</span></div></div>`,
TABLE:`<div class="demo"><table><thead><tr><th>Component</th><th>Browser</th><th>Win32</th></tr></thead><tbody><tr><td>Button</td><td class="pass">Pass</td><td class="pass">Pass</td></tr><tr><td>Dialog</td><td class="pass">Pass</td><td class="pass">Pass</td></tr></tbody></table></div>`,
DATA_GRID:`<div class="demo"><table role="grid"><thead><tr><th>Record</th><th>Kind</th><th>Status</th></tr></thead><tbody><tr><td>VIS-021</td><td>Visual</td><td class="pass">Pass</td></tr><tr><td>WIN-025</td><td>Native</td><td class="pass">Pass</td></tr><tr><td>ABL-031</td><td>Slice</td><td class="pass">Pass</td></tr></tbody></table></div>`,
LIST:`<div class="demo"><div class="panel"><button class="subject active" type="button"${attrs}>Recent runs</button><button class="subject" type="button"${attrs}>Releases</button><button class="subject" type="button"${attrs}>Policies</button></div></div>`,
NOTIFICATION:`<div class="demo"><div class="notice${klass}" role="status">The review completed and its receipt is available.</div><div class="notice refused" role="alert">Export path falls outside permitted custody.</div></div>`,
TOOLTIP:`<div class="demo"><div class="demo-row"><button class="demo-button"${attrs}>Review evidence</button><span class="panel" role="tooltip">Opens exact witness references</span></div></div>`,
DIALOG:`<div class="demo"><div class="panel${klass}" role="dialog" aria-modal="true"><h2 style="margin-top:0">Publish component profile?</h2><p style="color:var(--quiet)">This records the selected conditions and review receipt.</p><div class="demo-row"><button class="demo-button"${attrs}>Cancel</button>${button}</div></div></div>`,
PANEL:`<div class="demo"><section class="panel"><span class="demo-label">Governed panel</span><h2>Evidence summary</h2><p style="color:var(--quiet)">Structural grouping with an explicit semantic role.</p></section></div>`,
WINDOW:`<div class="demo"><section class="panel" role="application"><div class="frame-head"><strong>Mosaic application</strong><span class="chip">Signature</span></div><div style="padding:18px">Window root with governed layout and semantic children.</div></section></div>`};return map[kind]||`<div class="demo"><div class="panel">${esc(kind)} specimen</div></div>`}
function renderSpecimen(item){const kind=item.metadata.kind;if(kind)return componentSpecimen(kind);const kinds=item.component_kinds.slice(0,8).map(value=>`<span class="chip">${esc(value)}</span>`).join('');if(item.subject_type==='FOUNDATION')return `<div class="demo"><span class="demo-label">Foundation specimen · ${esc(item.label)}</span><div class="panel"><h2 style="margin-top:0">Aa Mosaic Signature</h2><p style="color:var(--quiet)">${esc(item.summary)}</p><div class="demo-row"><span class="chip">Canvas</span><span class="chip">Surface</span><span class="chip">Accent</span><span class="chip">Status</span></div></div></div>`;if(item.subject_type==='PATTERN')return `<div class="demo"><span class="demo-label">Task composition</span><div class="panel"><h2 style="margin-top:0">${esc(item.label)}</h2><div class="demo-row">${kinds}</div><p style="color:var(--quiet)">Inspect the complete task flow, recovery path, and evidence handoff.</p></div></div>`;if(item.subject_type==='SURFACE')return `<div class="demo"><div class="panel" role="application"><div class="frame-head"><strong>${esc(item.label)}</strong><span class="chip">Reference surface</span></div><div style="padding:18px"><div class="notice">Workflow ready · evidence retained</div><div class="demo-row" style="margin-top:16px">${kinds}</div></div></div></div>`;if(item.subject_type==='PROFILE')return `<div class="demo"><span class="demo-label">Profile system</span><div class="panel"><h2 style="margin-top:0">Mosaic Signature</h2><div class="demo-row"><button class="demo-button emphasis">Primary</button><button class="demo-button">Secondary</button><span class="chip">Dark</span><span class="chip">Light</span><span class="chip">High contrast</span></div></div></div>`;if(item.subject_type==='DELIVERY')return `<div class="demo"><table><thead><tr><th>Retained pathway</th><th>Closure</th></tr></thead><tbody><tr><td>Selected components</td><td class="pass">Exact</td></tr><tr><td>Shared semantic core</td><td class="pass">Required</td></tr><tr><td>Unused realizers</td><td>Removed</td></tr></tbody></table></div>`;return `<div class="demo"><div class="panel"><span class="demo-label">${esc(item.subject_type)}</span><h2>${esc(item.label)}</h2><p style="color:var(--quiet)">${esc(item.summary)}</p><div class="demo-row">${kinds}</div></div></div>`}
function governedComponentSpecimen(kind,def){const {state,attrs,klass}=commonState(),disabled=state==='DISABLED',visual=def.visual||{},value=specimenValue();const options=(visual.options||[]).map(option=>`<option${option===value?' selected':''}>${esc(option)}</option>`).join('');const special={
COMBOBOX:`<div class="demo"><label>${esc(visual.label)}</label><input class="demo-input${klass}" list="governed-combobox" value="${esc(value)}"${attrs}><datalist id="governed-combobox">${(visual.options||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist><span class="demo-label">Editable value, suggestions, free text, and no-result behavior</span></div>`,
CHECKBOX:`<div class="demo"><fieldset><legend>Delivery options</legend><label><input type="checkbox"${value?' checked':''}${attrs}> ${esc(visual.label)}</label><span class="demo-label">Value: ${value?'checked':'unchecked'} / interaction state: ${esc(state)}</span></fieldset></div>`,
MENU:`<div class="demo"><button type="button" class="demo-button" data-specimen-value="${value==='open'?'closed':'open'}" aria-expanded="${value==='open'}"${attrs}>Application menu</button>${value==='open'?`<div class="menu-pop" role="menu">${(visual.options||[]).map(x=>`<button role="menuitem" type="button" data-specimen-value="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:''}</div>`,
TREE:`<div class="demo"><div class="panel" role="tree" aria-disabled="${disabled}">${(visual.nodes||[]).map((x,i)=>`<button type="button" class="subject${x===value?' active':''}" role="treeitem" aria-level="${i?2:1}" data-specimen-value="${esc(x)}"${attrs}>${i?'  ':''}${esc(x)}</button>`).join('')}</div><span class="demo-label">Selected: ${esc(value)}</span></div>`,
PROGRESS:`<div class="demo"><label>${esc(visual.label)}</label>${state==='PENDING'?'<progress>Working</progress>':`<progress value="${state==='REFUSED'?100:Number(value)||68}" max="100"></progress>`}<span class="demo-label">${state==='REFUSED'?'Failed with typed refusal':state==='PENDING'?'Indeterminate operation':state==='DISABLED'?'Paused at '+esc(value)+'%':esc(value)+'% complete'}</span></div>`,
DATA_GRID:`<div class="demo"><table role="grid" aria-disabled="${disabled}"><thead><tr>${(visual.columns||[]).map(x=>`<th><button type="button" data-specimen-value="sort:${esc(x)}"${attrs}>${esc(x)} ↕</button></th>`).join('')}</tr></thead><tbody>${(visual.rows||[]).map(row=>`<tr tabindex="0" data-specimen-value="${esc(row[0])}" aria-selected="${row[0]===value}">${row.map((x,i)=>`<td${i===1?' contenteditable="true"':''}>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table><span class="demo-label">Selected/sort value: ${esc(value)}</span></div>`,
NOTIFICATION:`<div class="demo"><div class="notice${klass}" role="${state==='REFUSED'?'alert':'status'}">${esc((visual.messages||{})[state]||(visual.messages||{}).IDLE)}</div></div>`,
TOOLTIP:`<div class="demo"><div class="tooltip-host"><button type="button" class="demo-button"${attrs}>${esc(visual.anchor)}</button><div class="tooltip-pop" role="tooltip">${esc(visual.message)}</div></div><span class="demo-label">Appears only while the anchor is hovered or focused</span></div>`,
DIALOG:value==='open'||state==='FOCUSED'||state==='PRESSED'?`<div class="demo"><div class="panel dialog-preview${klass}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">${esc(visual.title)}</h2><p>Review the consequence before creating a local receipt.</p><div class="demo-row"><button type="button" data-specimen-value="closed">Cancel</button><button type="button" class="demo-button emphasis" data-specimen-value="published">Publish</button></div></div></div>`:`<div class="demo"><button type="button" class="demo-button emphasis" data-specimen-value="open"${attrs}>Open confirmation dialog</button></div>`};
if(special[kind])return special[kind];if(kind==='SELECT')return `<div class="demo"><label>${esc(visual.label)}</label><select${attrs}>${options}</select><span class="demo-label">Value: ${esc(value)} / state: ${esc(state)}</span></div>`;return componentSpecimen(kind)}
function foundationSpecimen(def){const v=def.visual||{},p=def.presentation;if(p==='TOKEN_SWATCHES'){const pal=(v.palettes||{})[condition('theme')];if(!pal)throw new Error('REVIEW_SPECIMEN_PALETTE_ABSENT: '+condition('theme'));return `<div class="demo"><div class="swatch-grid">${v.swatches.map(x=>`<div class="swatch" style="--swatch:${pal[x].color};--label:${pal[x].label}"><strong>${esc(x)}</strong></div>`).join('')}</div><span class="demo-label">Semantic roles under ${esc(condition('theme'))}; status retains text and role labels.</span></div>`}if(p==='TYPE_SCALE')return `<div class="demo">${v.roles.map((x,i)=>`<div><span class="demo-label">${esc(x)}</span><p class="type-sample" style="font-size:${[28,30,18,15,13][i]}px;font-family:${x==='mono'?'Consolas,monospace':'Segoe UI,sans-serif'};font-weight:${i<3?600:400}">${esc(v.samples[i%v.samples.length])}</p></div>`).join('')}</div>`;if(p==='SPACING_SCALE')return `<div class="demo">${v.tokens.map((x,i)=>`<div class="scale-row"><span>${esc(x)}</span><div class="scale-bar" style="--size:${[40,80,120,200,280][i]}px"></div></div>`).join('')}<span class="demo-label">Stack, inline, grid, and section gaps use the same scale.</span></div>`;if(p==='SIZE_MATRIX')return `<div class="demo"><div class="matrix-grid">${v.items.map((x,i)=>`<div class="panel" style="min-height:${[32,40,44,80,44][i]}px">${esc(x)}</div>`).join('')}</div><span class="demo-label">${esc(condition('density'))} / ${esc(condition('input'))}</span></div>`;if(p==='RADIUS_MATRIX')return `<div class="demo"><div class="matrix-grid">${v.uses.map((x,i)=>`<div class="panel" style="border-radius:${[0,4,6,4,6][i]}px">${esc(x)} · ${[0,4,6,4,6][i]}px</div>`).join('')}</div></div>`;if(p==='ICON_GALLERY')return `<div class="demo"><div class="matrix-grid">${v.icons.map((x,i)=>`<div class="panel"><strong aria-hidden="true">${['+','✎','⌕','≡','▣','⇩','↶','↷','×','!','?'][i]}</strong><br><span class="demo-label">${esc(x)}</span></div>`).join('')}</div></div>`;if(p==='MOTION_TIMELINE')return `<div class="demo"><div class="panel"><div class="scale-bar" style="--size:${specimenValue()==='playing'?'100%':'20%'};transition:width ${condition('preference')==='REDUCED_MOTION'?'0ms':'160ms'}"></div></div><button type="button" data-specimen-value="${specimenValue()==='playing'?'stopped':'playing'}">${specimenValue()==='playing'?'Reset':'Play transition'}</button><span class="demo-label">${esc(condition('preference'))}</span></div>`;if(p==='LOCALE_COMPARE')return `<div class="demo"><div class="matrix-grid"><section class="panel" dir="ltr"><strong>English</strong><p>Review evidence</p><button>Export local receipt</button></section><section class="panel" dir="rtl" lang="ar"><strong>العربية</strong><p>مراجعة الأدلة</p><button>تصدير الإيصال المحلي</button></section></div><span class="demo-label">Unknown reference → [message unavailable] / typed fallback</span></div>`;throw new Error('REVIEW_SPECIMEN_ABSENT: '+def.subject_id)}
function compositeSpecimen(def,item){const v=def.visual||{},value=specimenValue();if(def.presentation==='WORKFLOW')return `<div class="demo"><strong>${esc(v.title)}</strong><div class="workflow">${v.steps.map((step,i)=>`<button type="button" data-specimen-value="${i}" aria-current="${Number(value)===i?'step':'false'}"><span class="demo-label">${i+1}</span><br>${esc(step)}</button>`).join('')}</div><div class="notice">${Number(value)===v.steps.length-1?'Terminal outcome ready; local receipt can be inspected.':'Select each stage to review state, recovery, and evidence.'}</div></div>`;if(def.presentation==='REFERENCE_SURFACE')return `<div class="demo" role="application" aria-label="${esc(v.title)}"><div class="frame-head"><strong>${esc(v.title)}</strong><span class="chip">Functional reference surface</span></div><div class="region-grid">${v.regions.map((x,i)=>`<section class="region"><span class="demo-label">Region ${i+1}</span><h3>${esc(x)}</h3>${i===0?`<button type="button" data-specimen-value="region:${i}">Exercise</button>`:''}</section>`).join('')}</div><div class="notice">Value: ${esc(value)} · state and evidence retained by the shared session.</div></div>`;if(def.presentation==='PROFILE_MATRIX')return `<div class="demo"><table><thead><tr><th>Theme</th>${v.densities.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${v.themes.map(theme=>`<tr><th>${esc(theme)}</th>${v.densities.map(density=>`<td><button type="button" data-specimen-value="${esc(theme+'/'+density)}">Aa · 42 · Action</button></td>`).join('')}</tr>`).join('')}</tbody></table><span class="demo-label">Selected: ${esc(value)} · max radius 8 · no nested cards · contrast ≥ 4.5</span></div>`;if(def.presentation==='ABLATION_PLANNER'){const plan=v.plan||{};return `<div class="demo"><fieldset><legend>Components</legend>${v.selected.map(x=>`<label><input type="checkbox" checked value="${esc(x)}"> ${esc(x)}</label>`).join('')}</fieldset><label>Realizer pathway<select>${v.pathways.map(x=>`<option${x===plan.realizer?' selected':''}>${esc(x)}</option>`).join('')}</select></label><table><tbody><tr><th>Retained</th><td>${esc(plan.retained_module_count)} dependency-closed modules</td></tr><tr><th>Removed</th><td>${esc((plan.removed_component_modules||[]).length)} unused component modules</td></tr><tr><th>Estimate</th><td>${esc(plan.estimated_source_bytes)} source bytes</td></tr><tr><th>Plan</th><td class="pass">${esc((plan.commitment||'').slice(0,16))}...</td></tr></tbody></table></div>`}throw new Error('REVIEW_SPECIMEN_ABSENT: '+item.subject_id)}
function renderGovernedSpecimen(item){const def=item.metadata?.specimen;if(!def||def.subject_id!==item.subject_id||!def.presentation||def.presentation==='GENERIC')throw new Error('REVIEW_SPECIMEN_ABSENT: '+item.subject_id);if(def.presentation.startsWith('COMPONENT_'))return governedComponentSpecimen(item.metadata.kind,def);if(item.subject_type==='FOUNDATION')return foundationSpecimen(def);return compositeSpecimen(def,item)}
function renderInspector(item){const metadata=item.metadata||{},kind=metadata.kind||'',role=metadata.semantic_role||'review subject',keyboard=(metadata.keyboard||[]).join(' / ')||'Not interactive',realized=metadata.realized_by||[],evidence=metadata.evidence||[],definition=metadata.specimen||{},scope=session.action_scope,stateLabel=scope.state_control_visible?'States':'Review lens',stateValue=scope.state_control_visible?(metadata.states||[]).join(', '):scope.state_control_context;const views={anatomy:`<h2>Anatomy</h2><p class="summary">${esc(item.summary)}</p><div class="property"><span>Subject</span><span>${esc(item.subject_type)}</span></div><div class="property"><span>Specimen</span><span>${esc(definition.presentation||'ABSENT')}</span></div><div class="property"><span>Kind</span><span>${esc(kind||'Composite')}</span></div><div class="property"><span>Role</span><span>${esc(role)}</span></div><div class="property"><span>${esc(stateLabel)}</span><span>${esc(stateValue)}</span></div><div class="property"><span>Value</span><span>${esc(JSON.stringify(session.specimen_value))}</span></div>`,accessibility:`<h2>Accessibility</h2><div class="property"><span>Name</span><span class="pass">Required</span></div><div class="property"><span>Role</span><span>${esc(role)}</span></div><div class="property"><span>Keyboard</span><span>${esc(keyboard)}</span></div><div class="property"><span>Direction</span><span>${esc(condition('direction'))}</span></div><div class="property"><span>Preference</span><span>${esc(condition('preference'))}</span></div>`,tokens:`<h2>Resolved context</h2><div class="property"><span>Profile</span><span>${esc(ontology.profile_id)} ${esc(ontology.profile_version)}</span></div><div class="property"><span>Theme</span><span>${esc(condition('theme'))}</span></div><div class="property"><span>Density</span><span>${esc(condition('density'))}</span></div><div class="property"><span>Locale</span><span>${esc(condition('locale'))}</span></div><p class="summary">Exact resolved token values remain owned by the selected profile and theme resolver.</p>`,parity:`<h2>Realizer parity</h2>${['HEADLESS','BROWSER','WIN32'].map(value=>`<div class="property"><span>${value}</span><span class="${realized.includes(value)||!kind?'pass':'warn'}">${realized.includes(value)||!kind?'Defined projection':'No item claim'}</span></div>`).join('')}<p class="summary">These are specimen and catalog claims, not broad-host certification.</p>`,evidence:`<h2>Evidence references</h2>${(definition.required_evidence||[]).map(value=>`<div class="evidence">${esc(value)}</div>`).join('')}${evidence.map(value=>`<div class="evidence">${esc(value)}</div>`).join('')}<div class="property"><span>Specimen</span><span>${esc((definition.commitment||'').slice(0,16))}...</span></div>`,delivery:`<h2>Delivery and ablation</h2><div class="property"><span>Module</span><span>${esc(metadata.delivery?.component_module||'Composite/profile closure')}</span></div><div class="property"><span>Pathways</span><span>${esc((metadata.delivery?.shared_pathways||metadata.realizer_pathways||[]).join(', ')||'Subject dependent')}</span></div><div class="property"><span>Kinds</span><span>${esc(item.component_kinds.join(', ')||'None')}</span></div><p class="summary">Application slices retain only declared kinds and requested dependency-closed pathways.</p>`,lifecycle:`<h2>Lifecycle</h2><div class="property"><span>Version</span><span>${esc(ontology.profile_version)}</span></div><div class="property"><span>Standing</span><span>${esc(item.standing)}</span></div><div class="property"><span>Authority</span><span>NONE</span></div><div class="property"><span>Compatibility</span><span>Pre-1.0 additive runtime catalog</span></div>`};$('#inspector').innerHTML=views[activeView]||views.anatomy}
function renderTabs(){const host=$('#tabs');host.innerHTML='';for(const view of ontology.inspection_views){const button=document.createElement('button');button.type='button';button.role='tab';button.className='tab'+(view.view_id===activeView?' active':'');button.textContent=view.label;button.setAttribute('aria-selected',String(view.view_id===activeView));button.onclick=()=>reviewAction({intent:'SELECT_VIEW',value:view.view_id});host.appendChild(button)}}
function renderGuide(){const item=subjectById(selected),progress=session.progress,current=session.current_review,contract=item.review,scope=session.action_scope;let question=contract.question;if(session.mode==='EXPLORE')question='Purpose: '+contract.purpose;if(session.mode==='CHANGES')question=`Baseline comparison: ${session.changed_subject_ids.length} changed subjects. Current disposition: ${current.disposition.replaceAll('_',' ').toLowerCase()}.`;$('#review-question-title').textContent=session.mode==='GUIDED_REVIEW'?'Review question':session.mode==='CHANGES'?'What changed?':'What am I looking at?';$('#review-question').textContent=question;$('#check-summary').textContent=`Automated ${contract.automated_checks.length} · Assisted ${contract.assisted_checks.length} · Human ${contract.human_checks.length}`;$('#review-note').value=current.note;$('#review-note').disabled=!scope.review_note_enabled;$('#review-progress').max=progress.total;$('#review-progress').value=progress.reviewed;$('#review-progress-label').textContent=`${progress.reviewed} / ${progress.total} reviewed`;for(const button of document.querySelectorAll('[data-disposition]')){button.disabled=!scope.disposition_enabled;button.setAttribute('aria-pressed',String(button.dataset.disposition===current.disposition))}$('#previous').disabled=!scope.previous_enabled;$('#next').disabled=!scope.next_enabled;for(const button of document.querySelectorAll('[data-mode]'))button.classList.toggle('active',button.dataset.mode===session.mode)}
function wireSpecimenInteractions(){const host=$('#specimen');host.onclick=event=>{const target=event.target.closest('[data-specimen-value],button,[role="treeitem"],tr');if(!target||target.disabled||!session.action_scope.specimen_interaction_enabled)return;const value=target.dataset.specimenValue??target.value??target.textContent;setSpecimenValue(value)};host.onchange=event=>{const target=event.target.closest('input,select');if(!target||target.disabled||!session.action_scope.specimen_interaction_enabled)return;const value=target.type==='checkbox'?target.checked:target.type==='radio'?target.value:target.value;setSpecimenValue(value)}}
function renderSelection(){const item=subjectById(selected);if(!item)return;const group=ontology.groups.find(value=>value.group_id===item.group_id),specimen=$('#specimen'),definition=item.metadata?.specimen,scope=session.action_scope;if(!definition)throw new Error('REVIEW_SPECIMEN_ABSENT: '+item.subject_id);$('#subject-title').textContent=item.label;$('#subject-path').textContent=group.label+' / '+item.subject_type;$('#specimen-title').textContent=item.label+' specimen · '+(scope.specimen_interaction_enabled?'live interaction':'inspection only');$('#target-chip').textContent='HOST BROWSER / TARGET '+condition('realizer');$('#frame-meta').textContent=condition('viewport')+' / '+condition('locale')+' / '+condition('density');specimen.innerHTML=renderGovernedSpecimen(item);specimen.style.minHeight=Math.max(280,Number(definition.dimensions?.preferred_height)||300)+'px';specimen.dataset.simulatedState=condition('state');wireSpecimenInteractions();$('#frame').style.maxWidth=condition('viewport')==='MOBILE'?'390px':condition('viewport')==='TABLET'?'560px':'720px';$('#frame').dir=condition('direction').toLowerCase();renderInspector(item);renderGuide();const stateText=scope.state_control_visible?'Simulated: '+condition('state')+' ('+session.applicable_states.length+' applicable)':'Lens: '+scope.state_control_context;$('#interaction').textContent=stateText+' · Value: '+JSON.stringify(session.specimen_value)+' · Live: browser '+condition('input').toLowerCase().replaceAll('_',' ')}
function acceptSession(value){session=value;selected=value.subject_id;activeView=value.inspection_view;Object.assign(conditionValues,value.conditions);renderConditions();renderCatalog($('#search').value);renderStatebar();renderTabs();renderSelection()}
async function reviewAction(action){const response=await fetch('/api/review-action',{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({action})});const value=await response.json();if(!response.ok)throw new Error(value.refusal_code+': '+value.detail);acceptSession(value)}
async function recordSpecimenInteraction(raw){const value=String(raw||'ACTIVATE').trim().replace(/\s+/g,' ').slice(0,160)||'ACTIVATE',response=await fetch('/api/review-action',{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({action:{intent:'INTERACT',value}})}),next=await response.json();if(!response.ok){showError(new Error(next.refusal_code+': '+next.detail));return}session=next;$('#interaction').textContent=`Interaction recorded: ${value} · event ${session.event_count}`}
async function setSpecimenValue(value){const response=await fetch('/api/review-action',{method:'POST',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({action:{intent:'SET_SPECIMEN_VALUE',value}})}),next=await response.json();if(!response.ok){showError(new Error(next.refusal_code+': '+next.detail));return}acceptSession(next)}
async function snapshot(){const response=await fetch('/api/review-snapshot',{headers:{accept:'application/json'}});if(!response.ok)throw new Error('REVIEW_SNAPSHOT_REFUSED');const value=await response.json(),a=document.createElement('a');a.href='/api/review-snapshot?download=1';a.download='mosaic-ui-review-session.json';a.hidden=true;document.body.appendChild(a);a.click();a.remove();const toast=$('#toast');toast.textContent='Review session exported with '+value.event_count+' trace events.';toast.hidden=false;setTimeout(()=>toast.hidden=true,2600)}
async function load(){const [ontologyResponse,sessionResponse]=await Promise.all([fetch('/api/review-ontology',{headers:{accept:'application/json'}}),fetch('/api/review-session',{headers:{accept:'application/json'}})]);if(!ontologyResponse.ok||!sessionResponse.ok)throw new Error('REVIEW_WORKBENCH_LOAD_REFUSED');ontology=await ontologyResponse.json();session=await sessionResponse.json();selected=session.subject_id;activeView=session.inspection_view;Object.assign(conditionValues,session.conditions);acceptSession(session);$('#runner').textContent='Session governed / '+ontology.subjects.filter(item=>item.subject_type==='COMPONENT').length+' components';$('#coverage-result').textContent='PASS';$('#coverage-detail').textContent=ontology.groups.length+' groups / '+ontology.subjects.length+' review subjects / '+ontology.conditions.length+' condition axes';$('#coverage-receipt').textContent=ontology.commitment.slice(0,12);$('#ontology-root').textContent='ontology '+ontology.commitment.slice(0,16)+'...'}
$('#search').oninput=e=>renderCatalog(e.target.value);for(const b of opt('[data-batch-disposition]'))b.onclick=()=>reviewAction({intent:'SET_DISPOSITION_BATCH',subject_ids:[...batchSelection],value:b.dataset.batchDisposition,note:$('#review-note').value}).then(()=>{batchSelection.clear();renderCatalog($('#search').value)}).catch(showError);for(const c of opt('#batch-clear'))c.onclick=()=>{batchSelection.clear();renderCatalog($('#search').value)};$('#review-note').onchange=e=>reviewAction({intent:'SET_NOTE',value:e.target.value}).catch(showError);$('#snapshot').onclick=()=>snapshot().catch(showError);$('#previous').onclick=()=>reviewAction({intent:'PREVIOUS'}).catch(showError);$('#next').onclick=()=>reviewAction({intent:'NEXT',unresolved_only:session.mode==='GUIDED_REVIEW'}).catch(showError);for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>reviewAction({intent:'SET_MODE',value:button.dataset.mode}).catch(showError);for(const button of document.querySelectorAll('[data-disposition]'))button.onclick=()=>reviewAction({intent:'SET_DISPOSITION',value:button.dataset.disposition,note:$('#review-note').value}).catch(showError);function showError(error){$('#runner').textContent='Review refused';$('#runner').style.color='var(--refused)';$('#toast').textContent=error.message;$('#toast').hidden=false}load().catch(error=>{showError(error);$('#specimen').textContent=error.stack});
</script></body></html>
